name: AI Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --group dev

      - name: Build component and generated API
        run: npm run build

      - name: Verify generated files are committed
        run: git diff --exit-code -- dash_echartsx

      - name: Run repository checks
        run: |
          npm run lint
          npm run typecheck
          uv run ruff check .
          uv run pytest
