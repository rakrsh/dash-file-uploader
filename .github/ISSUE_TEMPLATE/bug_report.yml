name: Bug report
description: Report a reproducible defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "For suspected security vulnerabilities, use the private reporting link instead of this form."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal, safe reproduction. Do not attach real user files or credentials.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Relevant versions
      description: Package, Python, Dash, browser, and operating-system versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets, personal data, and file contents before sharing.
    validations:
      required: false
